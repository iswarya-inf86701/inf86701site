<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Social Embeds | Iswarya's Site</title>
    <script type="module" src="/scripts/scripts.js"></script>
    <link rel="stylesheet" href="/styles/styles.css" />
  </head>
  <body class="social-embeds">
    <header></header>
    <main>
      <div>
        <div>
          <h1>Social Embeds</h1>
          <p>This page demonstrates embedded YouTube and Twitter content.</p>
        </div>
      </div>

      <div>
        <div class="youtube-embed">
          <h2>YouTube video</h2>
          <iframe
            src="https://www.youtube.com/embed/aqz-KE-bpKQ"
            title="Big Buck Bunny video on YouTube"
            loading="lazy"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>
      </div>

      <div>
        <div class="twitter-embed">
          <h2>Twitter post</h2>
          <blockquote class="twitter-tweet">
            <p lang="en" dir="ltr">Follow Adobe for creative inspiration and product news.</p>
            &mdash; Adobe (@Adobe) <a href="https://twitter.com/Adobe">View Adobe on Twitter</a>
          </blockquote>
          <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
